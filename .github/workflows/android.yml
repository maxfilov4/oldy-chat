name: Build and verify Android beta
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oldy-beta-build
  cancel-in-progress: false
jobs:
  android:
    if: github.actor == 'maxfilov4' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore beta signing identity
        uses: actions/cache@v4
        with:
          path: .keys
          key: oldy-beta-signing-v1
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Server tests
        run: |
          python3 -m pip install cryptography
          python3 -m unittest discover -s tests -v
      - name: Build signed APK
        run: bash tools/build-apk.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash tools/smoke.sh
      - name: Package installer
        run: python3 tools/package-installer.py
      - uses: actions/upload-artifact@v4
        with:
          name: OldyChat-beta
          path: |
            build/OldyChat-beta.apk
            build/Install-OldyChat.txt
            build/screenshots
            build/android-errors.log
            build/crypto-results.txt
          retention-days: 30
