name: Oldy Cut Intel macOS
on:
  push:
    branches: [oldy-cut-macos]
    paths: ['oldycut/**', '.github/workflows/oldycut-macos.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 35
    defaults:
      run:
        working-directory: oldycut
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.12.0
      - name: Assets and tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tools/prepare_assets.py
          python -m unittest discover -s tests -v
      - name: Build app and DMG
        run: python tools/build_macos.py
      - uses: actions/upload-artifact@v4
        with:
          name: OldyCut-0.2.0-Intel
          path: |
            oldycut/release/*
            oldycut/build/bundle-check/result.json
            oldycut/build/bundle-check/compatibility.json
            oldycut/build/bundle-check/app.png
            oldycut/build/bundle-check/progress.png
          retention-days: 30
