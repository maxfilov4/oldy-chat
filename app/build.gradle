plugins { id 'com.android.application' }
android {
 namespace 'chat.oldy'
 testNamespace 'chat.oldy.tests'
 compileSdk 36
 defaultConfig {
  applicationId 'chat.oldy'
  testApplicationId 'chat.oldy.tests'
  minSdk 26
  targetSdk 36
  versionCode 10
  versionName '0.6.1-beta'
  testInstrumentationRunner 'chat.oldy.CryptoInstrumentation'
  ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
 }
 signingConfigs {
  beta { storeFile rootProject.file('.keys/beta.jks'); storePassword 'android'; keyAlias 'oldy-beta'; keyPassword 'android' }
 }
 buildFeatures { buildConfig true }
 buildTypes {
  release { signingConfig signingConfigs.beta; minifyEnabled false; buildConfigField 'boolean', 'DIRECT_UPDATES', 'true' }
  play { initWith release; buildConfigField 'boolean', 'DIRECT_UPDATES', 'false'; matchingFallbacks = ['release'] }
 }
 testBuildType 'release'
 sourceSets { androidTest { java.srcDirs = ['../tests']; java.include '**/*Instrumentation.java'; manifest.srcFile '../tests/AndroidManifest.xml'; assets.srcDirs = ['../tests/assets'] } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
 packaging { jniLibs { useLegacyPackaging true } }
}
dependencies {
 implementation 'net.java.dev.jna:jna:5.18.1@aar'
 implementation 'com.alphacephei:vosk-android:0.3.75@aar'
 implementation 'androidx.browser:browser:1.8.0'
 implementation 'io.github.webrtc-sdk:android:144.7559.12'
 implementation 'androidx.media3:media3-exoplayer:1.8.0'
}
